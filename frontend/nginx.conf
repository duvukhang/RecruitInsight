server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s;
    set $api_upstream backend:8000;
    client_max_body_size 51m;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass http://$api_upstream; proxy_read_timeout 120s; }
    location /docs { proxy_pass http://$api_upstream; }
    location /openapi.json { proxy_pass http://$api_upstream; }
    location / { try_files $uri $uri/ /index.html; }
}
